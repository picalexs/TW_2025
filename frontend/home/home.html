    <style>
      body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
      .hero { min-height: 80vh; position: relative; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem 5%; z-index: 1; overflow: hidden; }
      .hero-slideshow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; background-color: var(--shadow-color); }
      .hero-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center center; opacity: 0; transition: opacity 1.5s ease-in-out; z-index: 1; }
      .hero-slide.active { opacity: 1; z-index: 2; }
      .hero-content { position: relative; z-index: 2; text-align: center; color: var(--background-color); padding: 2rem; max-width: 80%; width: 100%; min-height: 400px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
      .hero-title { font-size: 6rem; margin-bottom: 1.5rem; text-shadow: 0.125rem 0.125rem 0.25rem var(--shadow-color); color: var(--background-color); font-weight: 700; line-height: 1.1; text-align: center; }
      .hero-subtitle { font-size: 1.75rem; margin-bottom: 2rem; text-shadow: 0.0625rem 0.0625rem 0.125rem var(--shadow-color); color: var(--background-color); text-align: center; }
      
      .loading-placeholder { background: linear-gradient(90deg, #f0f0f0 25%, transparent 37%, transparent 63%, #f0f0f0 75%); background-size: 400% 100%; animation: shimmer 1.5s infinite; }
      @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: -100% 50%; } }
      
      @media (max-width: 416px) {
        .hero-title { font-size: 2rem; }
        .hero-subtitle { font-size: 1.2rem; }
        .hero-content { padding: 1rem; min-height: 300px; }
      }
    </style>
