<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title data-i18n="profilePageTitle" data-i18n-fallback="User Profile"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../global/global.css">
    <link rel="stylesheet" href="profile.css">
</head>

<body>
    <div id="global-navbar"></div>

    <main class="profile-container">
        <div id="loading-state" class="loading-container">
            <div class="loading-spinner"></div>
            <p data-i18n="loadingProfile" data-i18n-fallback="Loading profile..."></p>
        </div>

        <div id="error-state" class="error-container" style="display: none;">
            <div class="error-message">
                <h2 data-i18n="errorTitle" data-i18n-fallback="Profile Not Found"></h2>
                <p data-i18n="errorMessage"
                    data-i18n-fallback="Sorry, we couldn't find the profile you're looking for."></p>
                <a href="../home/home.html" class="btn btn-primary" data-i18n="backToHome"
                    data-i18n-fallback="Back to Home"></a>
            </div>
        </div>

        <div id="profile-content" class="profile-content" style="display: none;">
            <div class="navigation-header">
                <a href="../home/home.html" class="back-link">
                    <span class="back-arrow">←</span>
                    <span data-i18n="backToHome" data-i18n-fallback="Back to Home"></span>
                </a>
            </div>

            <section class="profile-header">
                <div class="profile-hero">
                    <div class="profile-image-section">
                        <img id="profile-image" src="" alt="" class="profile-image">
                        <div class="profile-status">
                            <span id="user-role" class="role-badge"></span>
                        </div>
                    </div>

                    <div class="profile-basic-info">
                        <h1 id="user-name" class="profile-name"></h1>
                        <p id="username" class="username"></p>
                        
                        <div class="profile-stats-actions">                            
                            <div class="profile-stats">
                                <div class="stat-item" data-scroll-target="pets-section" role="button" tabindex="0" aria-label="Click to view available pets">
                                    <span class="stat-number" id="adoption-count">0</span>
                                    <span class="stat-label" data-i18n="adoptions"
                                        data-i18n-fallback="Adoptions"></span>
                                </div>
                                <div class="stat-item" data-scroll-target="reviews-section" role="button" tabindex="0" aria-label="Click to view reviews and testimonials">
                                    <span class="stat-number" id="pets-helped">0</span>
                                    <span class="stat-label" data-i18n="petsHelped" data-i18n-fallback="Pets Helped"></span>
                                </div>
                            </div>

                            <div class="profile-actions">
                                <button id="contact-user-btn" class="btn btn-primary" data-i18n="contactUser"
                                    data-i18n-fallback="Contact User"></button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="profile-details">
                <div class="detail-section">
                    <h3 data-i18n="aboutUser" data-i18n-fallback="About This User"></h3>
                    <div class="user-info-grid">
                        <div class="info-card">
                            <h4 data-i18n="memberSince" data-i18n-fallback="Member Since"></h4>
                            <p id="member-since" class="info-value"></p>
                        </div>
                    </div>
                </div>
                <div class="detail-section" id="reviews-section">
                    <h3 data-i18n="userReviews" data-i18n-fallback="Reviews & Testimonials"></h3>
                    <div id="reviews-container" class="reviews-container"></div>
                </div>

                <div class="detail-section" id="pets-section">
                    <h3 data-i18n="userPets" data-i18n-fallback="Available Pets"></h3>
                    <div id="pets-container" class="pets-grid"></div>
                </div>
            </section>
        </div>
    </main>

    <div id="contact-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 data-i18n="contactUser" data-i18n-fallback="Contact User"></h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="contact-form">
                    <div class="form-group">
                        <label data-i18n="yourName" data-i18n-fallback="Your Name"></label>
                        <input type="text" id="contact-name" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="yourEmail" data-i18n-fallback="Your Email"></label>
                        <input type="email" id="contact-email" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="message" data-i18n-fallback="Message"></label>
                        <textarea id="contact-message" rows="4" required></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary modal-close" data-i18n="cancel"
                            data-i18n-fallback="Cancel"></button>
                        <button type="submit" class="btn btn-primary" data-i18n="sendMessage"
                            data-i18n-fallback="Send Message"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div id="global-footer"></div>

    <script src="../utils/imagePathHandler.js"></script>
    <script src="../utils/cardRenderer.js"></script>
    <script type="module" src="../global/global.js"></script>
    <script type="module" src="../languages/language.js"></script>
    <script type="module" src="profile.js"></script>
</body>

</html>
