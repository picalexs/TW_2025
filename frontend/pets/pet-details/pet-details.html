<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="petDetailsPageTitle" data-i18n-fallback="Pet Details"></title>    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">      
    <link rel="preload" href="../../global/global.min.css" as="style" onload="this.rel='stylesheet'">
    <link rel="preload" href="../pets-page/pets-page.min.css" as="style" onload="this.rel='stylesheet'">
    <link rel="preload" href="pet-details.min.css" as="style" onload="this.rel='stylesheet'">
    <link rel="preload" href="https://unpkg.com/leaflet/dist/leaflet.css" as="style" onload="this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="../../global/global.min.css" />
      <link rel="stylesheet" href="../pets-page/pets-page.min.css" />
      <link rel="stylesheet" href="pet-details.min.css" />
      <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    </noscript>
</head>
<body>
    <div id="global-navbar">
      <div class="navbar-skeleton">
        <div class="skeleton-logo"></div>
        <div class="skeleton-nav">
          <div class="skeleton-nav-item"></div>
          <div class="skeleton-nav-item"></div>
          <div class="skeleton-nav-item"></div>
        </div>
        <div class="skeleton-auth">
          <div class="skeleton-auth-btn"></div>
          <div class="skeleton-auth-btn"></div>
        </div>
      </div>
    </div>
    
    <main class="pet-details-container">
        <div id="loading-state" class="loading-container">
            <div class="loading-spinner"></div>
            <p data-i18n="loadingPetDetails" data-i18n-fallback="Loading pet details..."></p>
        </div>

        <div id="error-state" class="error-container" style="display: none;">
            <div class="error-message">
                <h2 data-i18n="errorTitle" data-i18n-fallback="Pet Not Found"></h2>
                <p data-i18n="errorMessage" data-i18n-fallback="Sorry, we couldn't find the pet you're looking for."></p>
                <a href="../pets-page/pets-page.html" class="btn btn-primary" data-i18n="backToPets" data-i18n-fallback="Back to Pets"></a>
            </div>
        </div>

        <div id="pet-details-content" class="pet-details-content" style="display: none;">
            <div class="navigation-header">                
                <a href="../pets-page/pets-page.html" class="back-link">
                    <span class="back-arrow">←</span>
                    <span data-i18n="backToPets" data-i18n-fallback="Back to Pets"></span>
                </a>
            </div>

            <section class="pet-header">                
                <div class="pet-hero">
                    <div class="pet-image-gallery">
                        <div class="main-image-container">
                            <img id="main-pet-image" src="" alt="" class="main-pet-image">
                            <button id="favorite-btn" class="favorite-btn" title="Add to favorites">
                                <span class="heart-icon">♡</span>
                            </button>
                        </div>
                        <div id="image-thumbnails" class="image-thumbnails"></div>
                    </div>
                    <div class="pet-basic-info">
                        <div class="pet-header-row">
                            <h1 id="pet-name" class="pet-name"></h1>
                            <span id="adoption-status" class="status-badge"></span>
                        </div>
                        <div class="pet-quick-info">
                            <div class="info-item">
                                <span class="info-label" data-i18n="species" data-i18n-fallback="Species:"></span>
                                <span id="pet-species" class="info-value"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label" data-i18n="breed" data-i18n-fallback="Breed:"></span>
                                <span id="pet-breed" class="info-value"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label" data-i18n="age" data-i18n-fallback="Age:"></span>
                                <span id="pet-age" class="info-value"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label" data-i18n="gender" data-i18n-fallback="Gender:"></span>
                                <span id="pet-gender" class="info-value"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>            
            <div class="adoption-actions">
                <button id="contact-shelter-btn" class="btn btn-primary btn-large" data-i18n="contact" data-i18n-fallback="Contact"></button>
                <button id="edit-pet-btn" class="btn btn-secondary btn-large" data-i18n="editPet" data-i18n-fallback="Edit Pet" style="display: none;"></button>
            </div>

            <section class="pet-details-tabs">
                <div class="tabs-nav">
                    <button class="tab-btn active" data-tab="overview" data-i18n="overview" data-i18n-fallback="Overview"></button>
                    <button class="tab-btn" data-tab="health" data-i18n="health" data-i18n-fallback="Health & Care"></button>
                    <button class="tab-btn" data-tab="behavior" data-i18n="behavior" data-i18n-fallback="Behavior"></button>
                    <button class="tab-btn" data-tab="location" data-i18n="location" data-i18n-fallback="Location"></button>
                    <button class="tab-btn" data-tab="adoption" data-i18n="adoption" data-i18n-fallback="Adoption"></button>
                </div>

                <div id="overview-tab" class="tab-content active">
                    <div class="detail-section">
                        <h3 data-i18n="aboutPet" data-i18n-fallback="About This Pet"></h3>
                        <p id="pet-description" class="pet-description"></p>
                    </div>

                    <div class="detail-grid">
                        <div class="detail-card">
                            <h4 data-i18n="basicInfo" data-i18n-fallback="Basic Information"></h4>
                            <div class="detail-list">
                                <div class="detail-item">
                                    <span class="detail-label" data-i18n="size" data-i18n-fallback="Size:"></span>
                                    <span id="pet-size" class="detail-value"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label" data-i18n="weight" data-i18n-fallback="Weight:"></span>
                                    <span id="pet-weight" class="detail-value"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label" data-i18n="color" data-i18n-fallback="Color:"></span>
                                    <span id="pet-color" class="detail-value"></span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label" data-i18n="healthStatus" data-i18n-fallback="Health Status:"></span>
                                    <span id="pet-health-status" class="detail-value"></span>
                                </div>
                            </div>
                        </div>

                        <div class="detail-card">
                            <h4 data-i18n="characteristics" data-i18n-fallback="Characteristics"></h4>
                            <div id="pet-tags" class="pet-tags"></div>
                        </div>
                    </div>
                </div>

                <div id="health-tab" class="tab-content">
                    <div class="detail-section">
                        <h3 data-i18n="medicalHistory" data-i18n-fallback="Medical History"></h3>
                        <div id="medical-history" class="medical-records"></div>
                    </div>

                    <div class="detail-section">
                        <h3 data-i18n="careSchedule" data-i18n-fallback="Daily Care Schedule"></h3>
                        <div id="care-schedule" class="care-schedule"></div>
                    </div>

                    <div class="detail-section">
                        <h3 data-i18n="careResources" data-i18n-fallback="Care Resources"></h3>
                        <div id="care-resources" class="care-resources"></div>
                    </div>
                </div>

                <div id="behavior-tab" class="tab-content">
                    <div class="detail-section">
                        <h3 data-i18n="relationWithOthers" data-i18n-fallback="Relationship with Others"></h3>
                        <p id="pet-relations" class="behavior-description"></p>
                    </div>
                </div>                
                <div id="location-tab" class="tab-content">
                    <div class="detail-section">
                        <h3 data-i18n="petLocation" data-i18n-fallback="Pet Location"></h3>
                        <div id="pet-address" class="address-info"></div>
                        <div id="map" style="height: 400px; margin-top: 1rem; border-radius: 8px; overflow: hidden;"></div>
                    </div>

                    <div class="detail-section">
                        <h3 data-i18n="shelterInfo" data-i18n-fallback="Shelter Information"></h3>
                        <div id="shelter-info" class="shelter-info"></div>
                    </div>
                </div>

                <div id="adoption-tab" class="tab-content">
                    <div class="detail-section">
                        <h3 data-i18n="adoptionDetails" data-i18n-fallback="Adoption Details"></h3>
                        <div class="adoption-info">
                            <div class="detail-item">
                                <span class="detail-label" data-i18n="adoptionFee" data-i18n-fallback="Adoption Fee:"></span>
                                <span id="adoption-fee" class="detail-value fee-value"></span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label" data-i18n="availableSince" data-i18n-fallback="Available Since:"></span>
                                <span id="available-since" class="detail-value"></span>
                            </div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3 data-i18n="petStats" data-i18n-fallback="Pet Statistics"></h3>
                        <div id="pet-metrics" class="pet-metrics"></div>
                    </div>

                    <div class="detail-section">
                        <h3 data-i18n="adoptionHistory" data-i18n-fallback="Adoption History"></h3>
                        <div id="adoption-history" class="adoption-history"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="contact-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 data-i18n="contactShelter" data-i18n-fallback="Contact Shelter"></h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="contact-form">
                    <div class="form-group">
                        <label data-i18n="yourName" data-i18n-fallback="Your Name:"></label>
                        <input type="text" id="contact-name" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="yourEmail" data-i18n-fallback="Your Email:"></label>
                        <input type="email" id="contact-email" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="message" data-i18n-fallback="Message:"></label>
                        <textarea id="contact-message" rows="4" required></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary modal-close" data-i18n="cancel" data-i18n-fallback="Cancel"></button>
                        <button type="submit" class="btn btn-primary" data-i18n="sendMessage" data-i18n-fallback="Send Message"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>      
    
    <div id="global-footer"></div>      
    <script src="../../bundles/critical.min.js" defer></script>
    <script src="../../bundles/utils.min.js" defer></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script type="module" src="../../global/global.min.js"></script>
    <script type="module" src="../../languages/language.min.js"></script>
    <script type="module" src="pet-details.min.js"></script>
</body>
</html>
