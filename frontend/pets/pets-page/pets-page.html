                    </select>
                </div>
                
                <div class="filter-group">
                    <label class="filter-label" data-i18n="age" data-i18n-fallback="Age"></label>

                    </select>
                </div>
                
                <div class="filter-group">

                        <option value="" data-i18n="allSizes" data-i18n-fallback="All Sizes"></option>
                        <option value="small" data-i18n="small" data-i18n-fallback="Small"></option>
                        <option value="medium" data-i18n="medium" data-i18n-fallback="Medium"></option>
                        <option value="large" data-i18n="large" data-i18n-fallback="Large"></option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label class="filter-label" data-i18n="sortBy" data-i18n-fallback="Sort By"></label>
                    <select id="sort-filter" class="filter-select">

                </div>
                
                <div class="filters-row">
                    <div class="filter-group">
                        <label class="filter-label" data-i18n="searchName" data-i18n-fallback="Search by Name"></label>
                        <input type="text" id="name-search" class="filter-input" placeholder="Enter pet name...">
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" data-i18n="maxDistance" data-i18n-fallback="Max Distance (km)"></label>
                        <input type="number" id="distance-filter" class="filter-input" placeholder="50" min="1" max="500">
                    </div>
                </div>
            </div>
            
            <div class="filter-buttons">
                <button id="apply-filters" class="btn btn-primary" data-i18n="applyFilters" data-i18n-fallback="Apply Filters"></button>
                <button id="reset-filters" class="btn reset-filters" data-i18n="resetFilters" data-i18n-fallback="Reset"></button>

    <script src="../../bundles/critical.min.js" defer></script>
    <script src="../../bundles/utils.min.js" defer></script>
    
    <script type="module">
        import { fetchPets, renderPets, showPetLoadError, initializeViewToggle, initializeAdvancedFilters, initializeFilterButtons } from './pets-page.min.js';
        import '../../global/global.min.js'; 
        import languageManager from '../../languages/language.min.js';
        import RSSManager from '../../services/rssManager.js';

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                initializeViewToggle();
                initializeAdvancedFilters();
                initializeFilterButtons();
                
                // Initialize RSS Manager
                const rssManager = new RSSManager();
                rssManager.init();
                window.rssManager = rssManager;
                
                const loadPetsWithRetry = async () => {
                    try {
                        const pets = await fetchPets();
                        if (pets && pets.length > 0) {
                            renderPets(pets);
                        } else {
                            console.log("No pets received, retrying in 3 seconds...");
                            setTimeout(loadPetsWithRetry, 3000);
                        }
                    } catch (error) {
                        console.log("Failed to load pets, retrying in 3 seconds...", error);
                        setTimeout(loadPetsWithRetry, 3000);
                    }
                };
                
                loadPetsWithRetry();
            } catch (error) {
                console.error("Error during page initialization:", error);
            }
        });
    </script>
