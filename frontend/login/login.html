<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>  
  <link rel="preload" href="../global/global.min.css" as="style" onload="this.rel='stylesheet'">
  <link rel="preload" href="./login.min.css" as="style" onload="this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="../global/global.min.css" />
    <link rel="stylesheet" href="./login.min.css" />
  </noscript>
</head>

<body class="login-page">
  <div id="global-navbar">
    <div class="navbar-skeleton">
      <div class="skeleton-logo"></div>
      <div class="skeleton-nav">
        <div class="skeleton-nav-item"></div>
        <div class="skeleton-nav-item"></div>
        <div class="skeleton-nav-item"></div>
      </div>
      <div class="skeleton-auth">
        <div class="skeleton-auth-btn"></div>
        <div class="skeleton-auth-btn"></div>
      </div>
    </div>
  </div> <div id="mobile-overlay" class="mobile-overlay"></div>

  <div class="login-background">
    <div class="login-container">
      <form class="login-box">
        <h2 data-i18n="title">Log In</h2>

        <div class="form-group">
          <label for="email" data-i18n="emailLabel">Email</label>
          <input type="email" id="email" data-i18n-placeholder="emailPlaceholder" required />
        </div>

        <div class="form-group">
          <label for="password" data-i18n="passwordLabel">Password</label>
          <input type="password" id="password" data-i18n-placeholder="passwordPlaceholder" required />
        </div>

        <div class="form-options">
          <label><input type="checkbox" /> <span data-i18n="rememberMe">Remember me</span></label>
        </div>

        <button class="btn-submit" type="submit" data-i18n="loginButton">Log In</button>

        <div class="login-divider">
          <hr><span data-i18n="or">OR</span>
          <hr>
        </div>

        <button type="button" class="btn-google-login" id="google-login-button">
          <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo">
          <span data-i18n="googleLogin">Log in with Google</span>
        </button>

        <div class="forgot-password">
          <a href="#" data-i18n="forgotPassword">Forgot password?</a>
        </div>

        <div class="redirect-link">
          <span data-i18n="registerPrompt">Don't have an account?</span>
          <a href="../signup/signup.html" data-i18n="registerLink">Register</a>
        </div>

      </form>
    </div>
  </div>
  <div id="global-footer"></div>
  <script src="../bundles/critical.min.js" defer></script>
  <script src="../bundles/utils.min.js" defer></script>
  <script type="module" src="./login.min.js"></script>
</body>
</html>
