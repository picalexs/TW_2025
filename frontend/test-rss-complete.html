<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Widget Full Test</title>
    <link rel="stylesheet" href="global/rss-widget.css">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #f8f9fa; 
        }
        .test-container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
        }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            margin: 4px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: black; }
        .btn-danger { background: #dc3545; color: white; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        
        .debug-section {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .log-entry {
            padding: 8px;
            margin: 4px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            border-left: 4px solid #007bff;
            background: #f8f9fa;
        }
        
        .log-entry.error {
            border-left-color: #dc3545;
            background: #f8d7da;
            color: #721c24;
        }
        
        .log-entry.success {
            border-left-color: #28a745;
            background: #d4edda;
            color: #155724;
        }
        
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background: #ffffff;
        }
        
        .test-section h3 {
            margin-top: 0;
            color: #495057;
            border-bottom: 2px solid #007bff;
            padding-bottom: 8px;
        }
        
        .test-results {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            min-height: 40px;
        }
        
        .test-results.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .test-results.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .test-results.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 RSS Widget Complete Testing Suite</h1>
        <p>This page tests all RSS widget functionality including sharing, embed codes, and social media integration.</p>
        
        <!-- RSS Widget Container -->
        <div class="test-section">
            <h3>📡 RSS Widget</h3>
            <div id="rss-sharing-widget"></div>
        </div>
        
        <!-- Test Controls -->
        <div class="test-section">
            <h3>🎛️ Test Controls</h3>
            <div style="margin-bottom: 16px;">
                <button onclick="runAllTests()" class="btn btn-primary">▶️ Run All Tests</button>
                <button onclick="testAPIConnection()" class="btn btn-secondary">🔗 Test API</button>
                <button onclick="testWidgetInitialization()" class="btn btn-success">🏗️ Test Widget Init</button>
                <button onclick="testSharingFlow()" class="btn btn-warning">📤 Test Sharing</button>
                <button onclick="testEmbedCode()" class="btn btn-danger">📋 Test Embed</button>
            </div>
            <div>
                <button onclick="clearLogs()" class="btn btn-secondary">🗑️ Clear Logs</button>
                <button onclick="reinitializeWidget()" class="btn btn-warning">🔄 Reinit Widget</button>
                <button onclick="toggleDebugMode()" class="btn btn-success" id="debug-toggle">🐛 Enable Debug</button>
            </div>
        </div>
        
        <!-- Test Results -->
        <div class="test-section">
            <h3>📊 Test Results</h3>
            <div id="test-results" class="test-results info">
                Click "Run All Tests" to start comprehensive testing...
            </div>
        </div>
        
        <!-- Debug Logs -->
        <div class="debug-section">
            <h3>🐛 Debug Console</h3>
            <div id="debug-log" style="max-height: 300px; overflow-y: auto;"></div>
        </div>
    </div>

    <script type="module">
        import RSSManager from './services/rssManager.js';
        
        // Global state
        window.testRSSManager = null;
        window.debugLogs = [];
        window.debugMode = false;
        window.testResults = [];
        
        // Enhanced logging
        const originalConsole = {
            log: console.log,
            error: console.error,
            warn: console.warn
        };
        
        function addLog(message, type = 'info', source = 'TEST') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = { timestamp, message, type, source };
            window.debugLogs.push(logEntry);
            
            // Keep only last 100 logs
            if (window.debugLogs.length > 100) {
                window.debugLogs.splice(0, 1);
            }
            
            updateDebugDisplay();
            originalConsole.log(`[${timestamp}] ${source}: ${message}`);
        }
        
        // Override console methods
        console.log = function(...args) {
            originalConsole.log.apply(console, args);
            if (window.debugMode) {
                addLog(args.join(' '), 'info', 'LOG');
            }
        };
        
        console.error = function(...args) {
            originalConsole.error.apply(console, args);
            addLog(args.join(' '), 'error', 'ERROR');
        };
        
        console.warn = function(...args) {
            originalConsole.warn.apply(console, args);
            addLog(args.join(' '), 'warn', 'WARN');
        };
        
        function updateDebugDisplay() {
            const debugContainer = document.getElementById('debug-log');
            debugContainer.innerHTML = window.debugLogs.slice(-50).map(log => 
                `<div class="log-entry ${log.type}">
                    <strong>[${log.timestamp}] ${log.source}:</strong> ${log.message}
                </div>`
            ).join('');
            debugContainer.scrollTop = debugContainer.scrollHeight;
        }
        
        function updateTestResults(message, type = 'info') {
            const resultsContainer = document.getElementById('test-results');
            resultsContainer.className = `test-results ${type}`;
            resultsContainer.innerHTML = message;
            addLog(message, type, 'RESULT');
        }
        
        // Test functions
        window.testAPIConnection = async function() {
            addLog('Starting API connection test...', 'info', 'API');
            try {
                const response = await fetch('http://localhost:8080/api/rss/share?type=recent');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    addLog('✅ API connection successful', 'success', 'API');
                    addLog(`API returned ${Object.keys(data.data).length} data properties`, 'info', 'API');
                    updateTestResults('✅ API Connection: PASSED', 'success');
                    return true;
                } else {
                    throw new Error('API returned success: false');
                }
            } catch (error) {
                addLog(`❌ API connection failed: ${error.message}`, 'error', 'API');
                updateTestResults(`❌ API Connection: FAILED - ${error.message}`, 'error');
                return false;
            }
        };
        
        window.testWidgetInitialization = function() {
            addLog('Starting widget initialization test...', 'info', 'WIDGET');
            try {
                if (!window.testRSSManager) {
                    window.testRSSManager = new RSSManager();
                    window.rssManager = window.testRSSManager;
                }
                
                window.testRSSManager.init();
                
                // Check if widget was created
                const widget = document.getElementById('rss-sharing-widget');
                const toggleButton = document.getElementById('toggle-rss-widget');
                
                if (widget && toggleButton) {
                    addLog('✅ Widget initialization successful', 'success', 'WIDGET');
                    updateTestResults('✅ Widget Initialization: PASSED', 'success');
                    return true;
                } else {
                    throw new Error('Widget elements not found after initialization');
                }
            } catch (error) {
                addLog(`❌ Widget initialization failed: ${error.message}`, 'error', 'WIDGET');
                updateTestResults(`❌ Widget Initialization: FAILED - ${error.message}`, 'error');
                return false;
            }
        };
        
        window.testSharingFlow = async function() {
            addLog('Starting sharing flow test...', 'info', 'SHARE');
            try {
                if (!window.testRSSManager) {
                    throw new Error('RSS Manager not initialized');
                }
                
                // Test recent feed sharing
                await window.testRSSManager.shareFeed('recent');
                
                // Check if sharing options are visible
                const sharingOptions = document.getElementById('sharing-options');
                const embedTextarea = document.getElementById('embed-code');
                
                if (sharingOptions && sharingOptions.style.display === 'block') {
                    addLog('✅ Sharing flow completed successfully', 'success', 'SHARE');
                    
                    if (embedTextarea && embedTextarea.value && embedTextarea.value !== 'No embed code available') {
                        addLog('✅ Embed code generated successfully', 'success', 'SHARE');
                        updateTestResults('✅ Sharing Flow: PASSED - Share options loaded and embed code generated', 'success');
                        return true;
                    } else {
                        addLog('⚠️ Sharing flow succeeded but embed code is empty', 'warn', 'SHARE');
                        updateTestResults('⚠️ Sharing Flow: PARTIAL - Share options loaded but no embed code', 'warning');
                        return false;
                    }
                } else {
                    throw new Error('Sharing options not displayed');
                }
            } catch (error) {
                addLog(`❌ Sharing flow failed: ${error.message}`, 'error', 'SHARE');
                updateTestResults(`❌ Sharing Flow: FAILED - ${error.message}`, 'error');
                return false;
            }
        };
        
        window.testEmbedCode = async function() {
            addLog('Starting embed code test...', 'info', 'EMBED');
            try {
                const embedTextarea = document.getElementById('embed-code');
                
                if (!embedTextarea) {
                    throw new Error('Embed code textarea not found');
                }
                
                if (!embedTextarea.value || embedTextarea.value === 'No embed code available') {
                    throw new Error('No embed code available - run sharing test first');
                }
                
                // Test clipboard functionality
                try {
                    await navigator.clipboard.writeText(embedTextarea.value);
                    addLog('✅ Embed code copied to clipboard successfully', 'success', 'EMBED');
                    updateTestResults('✅ Embed Code: PASSED - Code available and clipboard copy works', 'success');
                    return true;
                } catch (clipboardError) {
                    addLog('⚠️ Clipboard API not available, testing fallback...', 'warn', 'EMBED');
                    
                    // Test if embed code has valid content
                    if (embedTextarea.value.includes('iframe') || embedTextarea.value.includes('http')) {
                        addLog('✅ Embed code content is valid', 'success', 'EMBED');
                        updateTestResults('✅ Embed Code: PASSED - Valid code available (clipboard API not supported)', 'success');
                        return true;
                    } else {
                        throw new Error('Embed code content appears invalid');
                    }
                }
            } catch (error) {
                addLog(`❌ Embed code test failed: ${error.message}`, 'error', 'EMBED');
                updateTestResults(`❌ Embed Code: FAILED - ${error.message}`, 'error');
                return false;
            }
        };
        
        window.runAllTests = async function() {
            addLog('🚀 Starting comprehensive test suite...', 'info', 'SUITE');
            updateTestResults('🔄 Running comprehensive tests...', 'info');
            
            const tests = [
                { name: 'API Connection', func: testAPIConnection },
                { name: 'Widget Initialization', func: testWidgetInitialization },
                { name: 'Sharing Flow', func: testSharingFlow },
                { name: 'Embed Code', func: testEmbedCode }
            ];
            
            let passed = 0;
            let failed = 0;
            
            for (const test of tests) {
                addLog(`Running test: ${test.name}`, 'info', 'SUITE');
                const result = await test.func();
                
                if (result) {
                    passed++;
                } else {
                    failed++;
                }
                
                // Wait a bit between tests
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            const total = tests.length;
            const passRate = Math.round((passed / total) * 100);
            
            if (failed === 0) {
                addLog(`🎉 All tests passed! (${passed}/${total})`, 'success', 'SUITE');
                updateTestResults(`🎉 All Tests PASSED! (${passed}/${total} - ${passRate}%)`, 'success');
            } else {
                addLog(`⚠️ Test suite completed with failures: ${passed} passed, ${failed} failed`, 'warn', 'SUITE');
                updateTestResults(`⚠️ Tests completed: ${passed} passed, ${failed} failed (${passRate}% pass rate)`, 'error');
            }
        };
        
        // Utility functions
        window.clearLogs = function() {
            window.debugLogs = [];
            updateDebugDisplay();
            addLog('Debug logs cleared', 'info', 'SYSTEM');
        };
        
        window.reinitializeWidget = function() {
            addLog('Reinitializing RSS widget...', 'info', 'SYSTEM');
            try {
                const widget = document.getElementById('rss-sharing-widget');
                if (widget) {
                    widget.innerHTML = '';
                }
                
                window.testRSSManager = new RSSManager();
                window.rssManager = window.testRSSManager;
                window.testRSSManager.init();
                
                addLog('✅ Widget reinitialized successfully', 'success', 'SYSTEM');
                updateTestResults('✅ Widget reinitialized successfully', 'success');
            } catch (error) {
                addLog(`❌ Widget reinitialization failed: ${error.message}`, 'error', 'SYSTEM');
                updateTestResults(`❌ Widget reinitialization failed: ${error.message}`, 'error');
            }
        };
        
        window.toggleDebugMode = function() {
            window.debugMode = !window.debugMode;
            const button = document.getElementById('debug-toggle');
            button.textContent = window.debugMode ? '🐛 Disable Debug' : '🐛 Enable Debug';
            addLog(`Debug mode ${window.debugMode ? 'enabled' : 'disabled'}`, 'info', 'SYSTEM');
        };
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            addLog('🚀 Test page loaded, initializing RSS Manager...', 'info', 'INIT');
            try {
                window.testRSSManager = new RSSManager();
                window.rssManager = window.testRSSManager;
                window.testRSSManager.init();
                addLog('✅ RSS Manager initialized successfully', 'success', 'INIT');
                updateTestResults('✅ Initial setup complete - Ready for testing', 'success');
            } catch (error) {
                addLog(`❌ Initialization failed: ${error.message}`, 'error', 'INIT');
                updateTestResults(`❌ Initialization failed: ${error.message}`, 'error');
            }
        });
    </script>
</body>
</html>
