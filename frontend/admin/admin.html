<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="../global/global.min.css">
  <style>
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 2em; }
    .admin-table th, .admin-table td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    .admin-table th { background: #f5f5f5; }
    .admin-delete-btn { color: #fff; background: #d9534f; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
    .admin-delete-btn:hover { background: #c9302c; }
    .admin-header { margin-top: 1em; }
  </style>
</head>
<body>
  <div id="global-navbar"></div>
  <main class="section-container">
    <h1 class="admin-header">Admin Panel - User Management</h1>
    <div id="admin-message"></div>
    <table class="admin-table" id="users-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Email</th>
          <th>Username</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-tbody">
        <!-- Users will be loaded here -->
      </tbody>
    </table>
  </main>
  <script type="module" src="../global/inject-navbar.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
