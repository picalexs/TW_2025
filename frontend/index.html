<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3;url=/home/home.html">
  <title>Pet Adoption Center</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;      
      background-color: #EAEFEF;
      color: #333446;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 2rem;
    }    
    h1 {
      color: #333446;
    }
    a {
      color: #3B82F6;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
    .redirect-message {
      margin-top: 1rem;
      font-size: 1.1rem;
    }
    .countdown {
      font-weight: bold;
      color: #3B82F6;
    }
  </style>  
  <script>
    let countdown = 3;
    
    function updateCountdown() {
      const countdownElement = document.querySelector('.countdown');
      if (countdownElement && countdown > 0) {
        countdownElement.textContent = countdown;
        countdown--;
        setTimeout(updateCountdown, 1000);
      } else {
        window.location.href = '/home/home.html';
      }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
      updateCountdown();
    });
  </script>
</head>
<body>  
  <div class="container">    
    <h1>Pet Adoption Center</h1>
    <p class="redirect-message">Redirecting to <a href="/home/home.html">Home Page</a> in <span class="countdown">3</span> seconds...</p>
    <p style="margin-top: 1rem; font-size: 0.9rem; color: #666;">
      <a href="/home/home.html">Click here if you are not redirected automatically</a>
    </p>
  </div>
</body>
</html>
