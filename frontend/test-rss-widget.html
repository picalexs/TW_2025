<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RSS Widget Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">        
    <link rel="stylesheet" href="global/global.min.css">
    <link rel="stylesheet" href="global/rss-widget.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .debug-info {
            background: #f0f0f0;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>RSS Widget Test Page</h1>
        <p>This page tests the RSS widget implementation</p>
        
        <div class="debug-info">
            <strong>Debug Info:</strong>
            <div id="debug-messages"></div>
        </div>
        
        <!-- RSS Widget Container -->
        <div id="rss-sharing-widget" style="border: 2px dashed #ccc; min-height: 50px; padding: 10px;">
            <p>RSS Widget should appear here...</p>
        </div>
        
        <div class="debug-info">
            <button onclick="testRSSManager()">Test RSS Manager</button>
            <button onclick="debugWidget()">Debug Widget</button>
        </div>
    </div>    <script type="module">
        import RSSManager from './services/rssManager.js';
        
        function addDebugMessage(message) {
            const debugDiv = document.getElementById('debug-messages');
            const timestamp = new Date().toLocaleTimeString();
            debugDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
        }
        
        window.addDebugMessage = addDebugMessage;
        
        window.testRSSManager = function() {
            addDebugMessage('Testing RSS Manager...');
            try {
                const rssManager = new RSSManager();
                addDebugMessage('RSS Manager created successfully');
                
                rssManager.init();
                addDebugMessage('RSS Manager initialized');
                
                window.rssManager = rssManager;
                addDebugMessage('RSS Manager added to window object');
            } catch (error) {
                addDebugMessage('Error: ' + error.message);
                console.error('RSS Manager Error:', error);
            }
        };
        
        window.debugWidget = function() {
            const widget = document.getElementById('rss-sharing-widget');
            addDebugMessage('Widget element: ' + (widget ? 'Found' : 'Not found'));
            if (widget) {
                addDebugMessage('Widget content length: ' + widget.innerHTML.length);
                addDebugMessage('Widget classes: ' + widget.className);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            addDebugMessage('DOM Content Loaded');
            
            // Automatically test the RSS Manager
            setTimeout(() => {
                testRSSManager();
            }, 100);
        });
    </script>
</body>
</html>
